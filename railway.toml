[build]
builder = "railpack"
buildCommand = "composer install --optimize-autoloader --no-dev --no-scripts --no-interaction"

[deploy]
preDeployCommand = ["php artisan migrate --force && php artisan db:seed --class=AdminUserSeeder --force"]
startCommand = "php artisan serve --host=0.0.0.0 --port=$PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
